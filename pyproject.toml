[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urbangeoai"
version = "0.1.0"
description = "Geospatial machine learning pipeline for urban accessibility indices"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "h3>=4.0",
    "scikit-learn>=1.3",
    "requests>=2.31",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
notebooks = ["jupyter", "ipykernel", "matplotlib", "seaborn", "pyarrow>=14"]
dev = ["pytest>=7.4", "pytest-cov", "ruff>=0.6", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402"]
