# UrbanGeoAI konfigürasyon şablonu
#
# Bu dosyayı 'config/paths.yml' olarak kopyalayın ve kendi yollarınızı yazın.
# 'paths.yml' depoya girmez (.gitignore).
#
#   cp config/paths.example.yml config/paths.yml
#
# Başka bir konum kullanmak için:
#   export URBANGEOAI_CONFIG=/yol/konfigurasyon.yml
#
# Göreli yollar depo köküne göre çözülür. Ortam değişkenleri genişletilir,
# örneğin ${HOME}/veri.

paths:
  # Güncel POI veri kümesi. İş ortağı tarafından sağlanır, depoda bulunmaz.
  raw_current: data/raw/current

  # Önceki veri sürümü. Sürümler arası karşılaştırma için kullanılır.
  # Karşılaştırma yapılmayacaksa boş bırakılabilir.
  raw_previous: data/raw/previous

  # İndirilen referans veriler (idari sınırlar, OpenStreetMap çıktıları).
  # Kaynaklarından otomatik indirilir; lisans nedeniyle yeniden dağıtılmaz.
  reference: data/reference

  # Depoyla birlikte gelen sentetik örnek veri.
  sample: data/sample

  # Üretilen çıktılar.
  output: out

  # Ağdan indirilen dosyaların önbelleği.
  cache: cache

grid:
  # Analiz alanı: [min_lon, min_lat, max_lon, max_lat]
  #
  # Not: bu kutu Bakı'nın idari sınırının tamamını kapsamaz. Qaradağ rayonu
  # güneyde 39.53 enlemine kadar iner; kutu 40.2'de kesilir. Kapsam kararı
  # gözden geçirilmeyi bekliyor.
  bbox: [49.5, 40.2, 50.4, 40.6]

  # H3 çözünürlüğü. 10 -> altıgen başına yaklaşık 15 000 m², kenar ~76 m.
  h3_resolution: 10

validation:
  # İki kaydın aynı nesne sayılacağı azami mesafe (metre).
  duplicate_radius_m: 50

  # Koordinatlarda beklenen asgari ondalık basamak sayısı.
  # 4 basamak yaklaşık 11 m belirsizlik demektir.
  min_coordinate_decimals: 5

  # Sınır kutusu dışındaki kayıtlar raporlanır.
  enforce_bbox: true

overpass:
  # Sırayla denenir. İlk yanıt veren kullanılır.
  mirrors:
    - https://overpass-api.de/api/interpreter
    - https://overpass.kumi.systems/api/interpreter
    - https://overpass.osm.ch/api/interpreter

metro:
  # İşletmede olmayan istasyonlar. OpenStreetMap inşa hâlindeki ve planlanan
  # istasyonları da kaydediyor; bir konuma "metroya 200 m" demek o metro açık
  # değilse yanlış olur.
  #
  # Bu liste yalnızca YEDEKTİR. Asıl kural veriden okunuyor: OpenStreetMap
  # açılmamış istasyonları 'construction' etiketiyle işaretliyor ve kod bu
  # etikete bakıyor. Liste, etiketi olmayan ama kapalı olduğu bilinen bir
  # istasyon çıkarsa kullanılır.
  #
  # Dikkat: buraya yazılan her isim doğrulanmış olmalı. Yanlış bir kayıt
  # çalışan bir istasyonu sessizce siler.
  not_operational: []

  # Ekibin işletmede olduğunu teyit ettiği istasyonlar. Bu isimler inşaat
  # etiketi ve servis noktası kontrollerinden muaftır. Örnek: Xocəsən hem
  # depo hem yolcu istasyonudur, adındaki "Depo" onu servis noktası
  # gösteriyordu.
  operational: []

  # Aktarma kompleksleri tek erişim noktası sayılsın mı?
  # Yolcu için tek yapıdır; iki kez saymak o noktanın ulaşım puanını şişirir.
  #
  # UYARI: bu kural yalnızca mesafeye bakar. Birbirine yakın iki kaydı
  # "aktarma kompleksi" sayar, ama yakınlığın başka bir sebebi de olabilir:
  # yanlış etiketlenmiş veya henüz açılmamış bir istasyon. Denetim kaydındaki
  # her aktarma kararı insan tarafından doğrulanmalıdır.
  merge_interchanges: true

  # Aynı isimli iki kaydın tekrar sayılacağı azami mesafe (metre).
  duplicate_radius_m: 200

  # Farklı isimli iki istasyonun aktarma kompleksi sayılacağı mesafe (metre).
  interchange_radius_m: 150
